plugins { id 'java' }
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
dependencies {
    testImplementation 'net.fabricmc:fabric-loader:0.19.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
test {
    useJUnitPlatform()
    systemProperty 'bundle.file', rootProject.file('../../artifacts/lavavisual-1.1.0-multiversion.jar').absolutePath
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}
