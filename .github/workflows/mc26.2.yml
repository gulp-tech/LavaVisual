name: Build LavaVisual 26.2 standalone
on:
  push:
    paths: ['ports/mc26.2/**', 'tools/client_smoke.py', 'tools/ci_run.sh', '.github/workflows/mc26.2.yml']
  workflow_dispatch:
concurrency:
  group: lavavisual-standalone-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build standalone JAR and run tests
        run: bash tools/ci_run.sh ports/mc26.2/gradlew -p ports/mc26.2 build --no-daemon
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 libflite1 imagemagick
      - name: Check client startup with Fabric Loader 0.19.3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 tools/client_smoke.py ports/mc26.2
      - name: Verify standalone metadata
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          log = Path('ports/mc26.2/build/client-smoke.log').read_text(errors='replace')
          assert 'with Fabric Loader 0.19.3' in log, 'Wrong runtime loader version'
          with zipfile.ZipFile('ports/mc26.2/build/libs/lavavisual-2.9.1-mc26.2.jar') as jar:
              m = json.loads(jar.read('fabric.mod.json'))
              assert m['id'] == 'lavavisual'
              assert m['depends']['minecraft'] == '26.2'
              assert m['depends']['fabricloader'] == '>=0.19.3'
              assert not m.get('jars'), 'Must not contain version adapters'
              assert jar.testzip() is None
              assert 'licenses/Inter-OFL.txt' in jar.namelist()
              assert 'licenses/Kenney-CC0.txt' in jar.namelist()
              assert 'licenses/Lucide-ISC.txt' in jar.namelist()
              fonts = [n for n in jar.namelist() if n.startswith('assets/lavavisual/font/') and n.endswith('.json')]
              assert len(fonts) == 57, len(fonts)
              sounds = [name for name in jar.namelist() if name.endswith('.ogg')]
              assert len(sounds) == 27, len(sounds)
              for name in sounds:
                  data = jar.read(name)
                  header = data.index(b'\x01vorbis')
                  assert data[header + 11] == 1, 'Positional audio must be mono'
              assert m['icon'] == 'assets/lavavisual/icon.png' and m['icon'] in jar.namelist()
              logos = [n for n in jar.namelist() if n.startswith('assets/lavavisual/textures/gui/logo/') and n.endswith('.png')]
              assert len(logos) == 16, len(logos)
              assert m['mixins'] == ['lavavisual.mixins.json']
              mixins = json.loads(jar.read('lavavisual.mixins.json'))
              assert set(mixins['client']) == {'HandViewMixin', 'SoundManagerMixin', 'MouseHandlerMixin', 'OptionsMixin', 'LevelRendererMixin', 'ScreenEffectRendererMixin'}
              forbidden = ('BoxEsp', 'Tracers', 'Chams', 'LivingEntityRendererMixin', 'LavaRenderLayers')
              assert not any(any(word in path for word in forbidden) for path in jar.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LavaVisual-2.9.1-mc26.2-standalone
          path: ports/mc26.2/build/libs/lavavisual-2.9.1-mc26.2.jar
      - name: Publish tested JAR
        if: github.ref == 'refs/heads/arena/01a0d2b1-lavavisual'
        run: |
          git pull --ff-only origin arena/01a0d2b1-lavavisual
          mkdir -p artifacts
          cp ports/mc26.2/build/libs/lavavisual-2.9.1-mc26.2.jar artifacts/
          rm -f artifacts/ui-2.*.png
          test ! -f ports/mc26.2/build/ui-smoke.png || cp ports/mc26.2/build/ui-smoke.png artifacts/ui-2.9.png
          for shot in ports/mc26.2/build/shot-*.png; do if [ -f "$shot" ]; then cp "$shot" "artifacts/ui-2.9-$(basename "$shot" .png | cut -c6-).png"; fi; done
          (cd artifacts && sha256sum *.jar > SHA256SUMS)
          printf 'Source: %s\nBuild: https://github.com/%s/actions/runs/%s\nMinecraft: 26.2\nTested Fabric Loader: 0.19.3\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/STANDALONE-26.2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish tested standalone 26.2 JAR for Loader 0.19.3 [skip ci]'
          git push origin HEAD:arena/01a0d2b1-lavavisual
