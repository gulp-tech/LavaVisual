name: Build LavaVisual
on:
  push:
    paths: ['src/**', 'build.gradle', 'gradle.properties', 'settings.gradle', 'gradle/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and report diagnostics
        shell: bash
        run: |
          set +e
          ./gradlew build --no-daemon > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          import pathlib
          lines = pathlib.Path('build.log').read_text().splitlines()[-100:]
          for i in range(0, len(lines), 15):
              message = '\n'.join(lines[i:i+15]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Gradle diagnostics::' + message)
          PYTHON
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: LavaVisual-mc1.20.4
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish installable JAR to working branch
        if: github.ref == 'refs/heads/arena/01a0d2b1-lavavisual'
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/libs/lavavisual-1.0.0+mc1.20.4.jar artifacts/
          (cd artifacts && sha256sum lavavisual-1.0.0+mc1.20.4.jar > SHA256SUMS)
          printf 'Source commit: %s\nBuild run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/BUILD.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish compiled Minecraft 1.20.4 JAR [skip ci]'
            git push origin HEAD:arena/01a0d2b1-lavavisual
          fi
