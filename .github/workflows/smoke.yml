name: Client startup smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
          - mc: '26.2'
            java: '25'
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 libflite1
      - name: Start client and check resources and mixins
        run: python3 tools/client_smoke.py ports/mc${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-log-${{ matrix.mc }}
          path: |
            ports/mc${{ matrix.mc }}/build/client-smoke.log
            ports/mc${{ matrix.mc }}/run/logs/latest.log
