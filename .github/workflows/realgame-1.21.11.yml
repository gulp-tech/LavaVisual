name: Real game test (Minecraft 1.21.11)
# Starts the actual game the player starts: vanilla 1.21.11 + Fabric Loader + the published jar,
# not the development client. This is the only way to catch problems that only exist after remapping.
# The published jar is committed by the build workflow with its own token, and such a push never starts
# another workflow, so this one also runs from the Actions tab (`gh workflow run realgame-1.21.11.yml`).
# It runs on every published 1.21.11 jar (перезапуск: 1.1.1 — без скинов, украшенные шляпы, крылья, плащи, меню и полосы прочности), and a fresh release is validated by touching this file: the run then
# picks up the newest jar in artifacts/ and plays it for real. This run is the last gate before the release page.
# (1.1.1: файл тронут, чтобы живой прогон взял уже новый jar из artifacts/, а не прежний.)
on:
  push:
    paths: ['artifacts/lavavisual-*-mc1.21.11.jar', '.github/workflows/realgame-1.21.11.yml', 'tools/real_game.py']
  workflow_dispatch:
concurrency:
  group: lavavisual-real-1-21-11-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 imagemagick
          pipx install portablemc || pip install --break-system-packages portablemc
      - name: Start the real game with the published jar
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 tools/real_game.py 1.21.11
      - name: Keep what the player would see
        if: always()
        run: |
          mkdir -p artifacts/debug
          cp -f build/real-1.21.11.png artifacts/debug/real-1.21.11.png || true
          tail -c 200000 build/real-1.21.11.log > artifacts/debug/real-1.21.11.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin "$GITHUB_REF_NAME" && git stash -q -u && git reset -q --hard "origin/$GITHUB_REF_NAME" && git stash pop -q || true
          git add -f artifacts/debug
          git commit -q -m 'Real game run [skip ci]' || exit 0
          git push -q origin "HEAD:$GITHUB_REF_NAME" || true
