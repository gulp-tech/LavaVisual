name: Build version adapters
on:
  push:
    paths: ['ports/**', 'tools/**', '.github/workflows/ports.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  adapters:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.4'
            java: '21'
            gradle: '8.12'
          - mc: '26.2'
            java: '25'
            gradle: '9.5.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build adapter
        shell: bash
        run: |
          set +e
          task=build
          gradle -p ports/mc${{ matrix.mc }} "$task" --no-daemon > build-port.log 2>&1
          result=$?
          cat build-port.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import pathlib
          lines = pathlib.Path('build-port.log').read_text().splitlines()[-120:]
          for i in range(0, len(lines), 15):
              msg = '\n'.join(lines[i:i+15]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Adapter diagnostics::' + msg)
          PY
          fi
          exit "$result"
      - name: Install virtual display for client smoke
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 libflite1
      - name: Verify client initialization before publishing
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python3 tools/client_smoke.py ports/mc${{ matrix.mc }}
      - uses: actions/upload-artifact@v4
        with:
          name: LavaVisual-mc${{ matrix.mc }}
          path: |
            ports/mc${{ matrix.mc }}/build/libs/*.jar
            ports/mc${{ matrix.mc }}/build/api-signatures.txt
  publish:
    needs: adapters
    if: github.ref == 'refs/heads/arena/01a0d2b1-lavavisual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: LavaVisual-mc*
          path: collected
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
      - name: Package and validate multi-version JAR
        run: |
          mkdir -p artifacts
          find collected -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ \;
          python3 tools/package_bundle.py
          bash tools/ci_run.sh gradle -p tools/bundle-test test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LavaVisual-multiversion
          path: artifacts/lavavisual-1.1.0-multiversion.jar
      - name: Publish adapters
        run: |
          mkdir -p artifacts
          find collected -name '*.jar' ! -name '*-sources.jar' -exec cp {} artifacts/ \;
          (cd artifacts && sha256sum *.jar > SHA256SUMS)
          printf 'Adapter source: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/ADAPTERS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish version-specific adapters [skip ci]'
          git pull --rebase origin arena/01a0d2b1-lavavisual
          git push origin HEAD:arena/01a0d2b1-lavavisual
