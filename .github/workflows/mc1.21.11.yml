name: Build LavaVisual (Minecraft 1.21.11)
on:
  push:
    paths: ['ports/mc1.21.11/**', '.github/workflows/mc1.21.11.yml']
  workflow_dispatch:
concurrency:
  group: lavavisual-1-21-11-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Dump the API of this Minecraft version
        run: |
          set -o pipefail
          ports/mc1.21.11/gradlew -p ports/mc1.21.11 classpathFile --no-daemon 2>&1 | tee build.log
          cp=$(cat ports/mc1.21.11/build/compile-classpath.txt)
          mkdir -p artifacts/debug
          : > artifacts/debug/api-1.21.11.txt
          python3 -c "import sys,zipfile,re;pat=re.compile(r'(renderer/state|renderer/entity/state|entity/player|entity/layers|rendering/v1|renderer/rendertype|blaze3d/pipeline|blaze3d/[A-Z]|client/gui/GuiGraphics|RenderPipelines|SubmitNodeCollector)');print(chr(10).join(sorted({n[:-6].replace('/','.') for j in sys.argv[1].split(':') if j.endswith('.jar') for n in (zipfile.ZipFile(j).namelist() if True else []) if n.endswith('.class') and pat.search(n) and '\$' not in n})))" "$cp" > artifacts/debug/classes-1.21.11.txt || true
          for c in $(cat artifacts/debug/classes-1.21.11.txt) 'com.mojang.blaze3d.pipeline.RenderPipeline$Builder' 'net.minecraft.client.renderer.RenderPipelines' 'net.minecraft.client.renderer.rendertype.RenderSetup$RenderSetupBuilder' 'net.fabricmc.fabric.api.client.screen.v1.Screens' 'net.minecraft.client.gui.screens.inventory.InventoryScreen' 'net.minecraft.client.multiplayer.ClientLevel' 'net.minecraft.world.level.Level' 'net.minecraft.server.level.ClientInformation' 'net.minecraft.world.entity.Avatar' 'net.minecraft.world.entity.player.Player' 'net.minecraft.world.entity.player.PlayerModelPart' 'net.minecraft.client.Camera' 'net.minecraft.client.renderer.GameRenderer' 'net.minecraft.client.MouseHandler' 'net.minecraft.client.Options' 'net.minecraft.client.Minecraft' 'net.minecraft.client.gui.Gui' 'net.minecraft.client.multiplayer.ClientPacketListener' 'net.minecraft.client.renderer.ItemInHandRenderer' 'net.minecraft.client.renderer.LevelRenderer' 'net.minecraft.client.renderer.ScreenEffectRenderer' 'net.minecraft.client.sounds.SoundManager' 'net.minecraft.client.renderer.entity.EntityRenderer'; do
            echo "=== $c" >> artifacts/debug/api-1.21.11.txt
            javap -classpath "$cp" -p "$c" >> artifacts/debug/api-1.21.11.txt 2>&1 || true
          done
          wc -l artifacts/debug/api-1.21.11.txt artifacts/debug/classes-1.21.11.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin "$GITHUB_REF_NAME" && git stash -q -u && git reset -q --hard "origin/$GITHUB_REF_NAME" && git stash pop -q || true
          git add -f artifacts/debug && git commit -q -m 'API dump [skip ci]' && git push -q origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Build
        run: |
          set -o pipefail
          ports/mc1.21.11/gradlew -p ports/mc1.21.11 build --no-daemon 2>&1 | tee build.log

      - name: Keep the errors when the build fails
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --mixed "origin/$GITHUB_REF_NAME"
          mkdir -p artifacts/debug
          grep -E "error:|error;|cannot find symbol|symbol:|location:|^e: |FAILURE|What went wrong|MIXIN PROBLEM|javap failed|mixin descriptors|> " build.log | head -1500 > artifacts/debug/mc1.21.11-errors.txt || true
          grep -cE "error:" build.log >> artifacts/debug/mc1.21.11-errors.txt || true
          git add -f artifacts/debug
          git commit -q -m 'Build log [skip ci]' || exit 0
          git push -q origin "HEAD:$GITHUB_REF_NAME" || true
      - name: Install virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 libflite1 imagemagick

      - name: Check that the client starts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p ports/mc1.21.11/run/config
          printf '{"edition": "client"}\n' > ports/mc1.21.11/run/config/lavavisual-client.json
          python3 tools/client_smoke.py ports/mc1.21.11
      - name: The main menu must not be a black screen
        run: |
          shot=ports/mc1.21.11/build/shot-title.png
          test -f "$shot"
          mean=$(identify -format '%[fx:mean]' "$shot")
          echo "main menu brightness: $mean"
          python3 -c "import sys; v=float(sys.argv[1]); print('menu brightness', v); sys.exit(0 if v > 0.02 else 1)" "$mean"
          mkdir -p artifacts/debug && cp "$shot" artifacts/debug/menu-1.21.11.png
          for later in hud hats map inventory world_hotbar world_hitbox world_hitbox_fill world_hitbox_corners world_hitbox_reach; do
            test ! -f ports/mc1.21.11/build/shot-$later.png || cp ports/mc1.21.11/build/shot-$later.png artifacts/debug/shot-$later-1.21.11.png
          done

      - name: Check the mixin targets against this version
        run: |
          cp=$(cat ports/mc1.21.11/build/compile-classpath.txt)
          python3 tools/check_mixins.py ports/mc1.21.11 "$cp" 2>&1 | tee -a build.log
      - name: Keep the client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-log-1-21-11
          path: |
            ports/mc1.21.11/build/client-smoke.log
            ports/mc1.21.11/run/logs/latest.log
          if-no-files-found: ignore

      - name: Keep the client log in the repository when it fails
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --mixed "origin/$GITHUB_REF_NAME"
          mkdir -p artifacts/debug
          tail -c 200000 ports/mc1.21.11/build/client-smoke.log > artifacts/debug/mc1.21.11-client.log || true
          git add -f artifacts/debug
          git commit -q -m 'Client log [skip ci]' || exit 0
          git push -q origin "HEAD:$GITHUB_REF_NAME" || true

      - name: Publish tested build
        if: github.event_name == 'push'
        run: |
          version=$(grep '^mod_version=' ports/mc1.21.11/gradle.properties | cut -d= -f2)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p artifacts
            rm -f artifacts/lavavisual-*-mc1.21.11.jar
            cp "ports/mc1.21.11/build/libs/lavavisual-${version}.jar" artifacts/
            rm -f artifacts/LavaVisual-Client-*mc1.21.11.*
            api=$(grep '^fabric_version=' ports/mc1.21.11/gradle.properties | cut -d= -f2)
            api_jar=$(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/fabric-api -name "fabric-api-${api}.jar" 2>/dev/null | head -1)
            python3 tools/make_client.py "artifacts/lavavisual-${version}.jar" artifacts "$api_jar" ports/mc1.21.11
            (cd artifacts && sha256sum *.jar *.mrpack *.zip > SHA256SUMS)
            git add artifacts
            git diff --cached --quiet && exit 0
            git commit -q -m 'Publish tested 1.21.11 build [skip ci]'
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
