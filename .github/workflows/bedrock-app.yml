name: Build LavaVisual Bedrock app (Android overlay)
on:
  push:
    paths: ['bedrock-app/**', '.github/workflows/bedrock-app.yml']
  workflow_dispatch:
concurrency:
  group: lavavisual-bedrock-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5

      - name: Icons are up to date
        run: |
          pip install --quiet pillow
          python3 bedrock-app/tools/make_icon.py
          git diff --exit-code -- bedrock-app/app/src/main/res

      - name: Accessory geometry matches the Geyser extension
        run: diff -r bedrock/geyser-extension/src/main/resources/lavavisual/geometry bedrock-app/app/src/main/assets/geometry

      - name: Tests and APK
        run: bedrock-app/gradlew -p bedrock-app :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it on an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash bedrock-app/tools/emulator_smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavavisual-bedrock-app
          path: |
            bedrock-app/app/build/outputs/apk/debug/*.apk
            bedrock-app/build/shots

      - name: Publish tested app
        if: github.event_name == 'push'
        run: |
          version=$(grep '^version=' bedrock-app/gradle.properties | cut -d= -f2)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p artifacts/bedrock-app/shots
            rm -f artifacts/bedrock-app/*.apk
            cp bedrock-app/app/build/outputs/apk/debug/app-debug.apk "artifacts/bedrock-app/LavaVisual-${version}.apk"
            cp bedrock-app/build/shots/*.png artifacts/bedrock-app/shots/
            (cd artifacts/bedrock-app && sha256sum *.apk > SHA256SUMS)
            printf 'Source: %s\nBuild: https://github.com/%s/actions/runs/%s\nAndroid overlay app, started on an API 30 emulator\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/bedrock-app/BUILD.txt
            git add artifacts/bedrock-app
            git diff --cached --quiet && exit 0
            git commit -q -m 'Publish tested Bedrock app [skip ci]'
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
