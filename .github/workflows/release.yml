name: Publish release

# Собранные и проверенные файлы из artifacts/ выкладываются как релиз, чтобы у каждой версии была одна страница
# (обновлено: сборка с горничной вместо Амонг Аса, новой коляской и украшенным меню).
# (перезапуск после публикации новой сборки: тронуть этот файл — пуш бота, который выкладывает jar, сборку не запускает).
# со скачиванием. Запускается сам после публикации сборки и вручную: Actions -> Publish release -> Run workflow.
on:
  push:
    paths: ['artifacts/**', '.github/workflows/release.yml']
  # The builds publish their files with the bot token, and pushes made with that token do not start other workflows.
  # Listening for the builds themselves keeps the download page on the newest tested files without a manual restart.
  workflow_run:
    workflows: ['Build LavaVisual 26.2 standalone', 'Build LavaVisual (Minecraft 1.21.11)', 'Build LavaVisual (Minecraft 1.21.4)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A failed build leaves the page as it is; a successful one refreshes it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest build on the branch (1.0.5 wins over 1.0.4 even if an old file is still around).
          MAIN=$(ls artifacts/lavavisual-*-mc26.2.jar 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MAIN" ]; then
            echo "на этой ветке нет опубликованных сборок — публиковать нечего"
            exit 0
          fi
          VERSION=$(basename "$MAIN" | sed 's/^lavavisual-//; s/-mc26\.2\.jar$//')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже есть — обновляю файлы"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "LavaVisual $VERSION" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" --clobber \
            artifacts/lavavisual-"$VERSION"-*.jar \
            artifacts/LavaVisual-Client-"$VERSION"-*.zip \
            artifacts/LavaVisual-Client-"$VERSION"-*.mrpack \
            artifacts/SHA256SUMS \
            artifacts/STANDALONE-26.2.txt
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) — \(.size) байт"'
