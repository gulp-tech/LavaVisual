name: Publish release
# (1.1.5 финал: файл тронут — публикуем сборки с радио, хитбоксами, хит-рейнджем, значком в списке игроков и новым меню).
# (1.1.6 финал: файл тронут — публикуем сборки со значками во всех версиях и списком игроков).
# (1.1.6 итог: файл тронут ещё раз — сборки уже лежат в artifacts/, публикуем страницу релиза 1.1.6).
# (1.1.7: файл тронут — публикуем сборки с настоящим радио, ванильными хитбоксами и числом досягаемости у прицела).
# (1.1.3 финал: файл тронут — публикуем сборки с украшенной прочностью в хотбаре).
# (1.1.2 финал: файл тронут — публикуем сборки 1.1.2 с украшенной прочностью и предупреждением о низкой прочности).
# (1.1.1 финал: файл тронут — публикуем сборки 1.1.1 без скинов, с украшенной прочностью.

# Собранные и проверенные файлы из artifacts/ выкладываются как релиз, чтобы у каждой версии была одна страница
# (обновлено: 1.1.1 — скины убраны целиком; косметика, меню, HUD и полосы прочности украшены).
# (перезапуск 1.1.1: сборки положили свежие файлы в artifacts/, а пуш бота чужие workflow не запускает — этот файл тронут,
#  чтобы страница релиза собралась из новых файлов; сборку такой пуш не запускает).
# со скачиванием. Файлы берутся из artifacts/ (их кладут три сборки, каждая со своими смоук-кадрами).
# Запускается пушем в этот файл или вручную: Actions -> Publish release -> Run workflow.
on:
  push:
    paths: ['artifacts/**', '.github/workflows/release.yml']
  # The builds publish their files with the bot token, and pushes made with that token do not start other workflows.
  # Listening for the builds themselves keeps the download page on the newest tested files without a manual restart.
  workflow_run:
    workflows: ['Build LavaVisual 26.2 standalone', 'Build LavaVisual (Minecraft 1.21.11)', 'Build LavaVisual (Minecraft 1.21.4)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A failed build leaves the page as it is; a successful one refreshes it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest build on the branch (1.1.1 wins over an older file if one is still around).
          MAIN=$(ls artifacts/lavavisual-*-mc26.2.jar 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$MAIN" ]; then
            echo "на этой ветке нет опубликованных сборок — публиковать нечего"
            exit 0
          fi
          VERSION=$(basename "$MAIN" | sed 's/^lavavisual-//; s/-mc26\.2\.jar$//')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже есть — обновляю файлы"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "LavaVisual $VERSION" --notes-file .github/release-notes.md
          fi
          gh release upload "$TAG" --clobber \
            artifacts/lavavisual-"$VERSION"-*.jar \
            artifacts/LavaVisual-Client-"$VERSION"-*.zip \
            artifacts/LavaVisual-Client-"$VERSION"-*.mrpack \
            artifacts/SHA256SUMS \
            artifacts/STANDALONE-26.2.txt
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) — \(.size) байт"'
