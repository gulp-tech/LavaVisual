plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = project.mod_version
group = 'tech.gulp'
base { archivesName = 'lavavisual' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar { from('LICENSE') }

tasks.register('apiSignatures') {
    doLast {
        def names = [
            'net.minecraft.client.sounds.WeighedSoundEvents',
            'net.minecraft.client.sounds.Sound',
            'net.minecraft.client.resources.sounds.AbstractSoundInstance',
            'net.minecraft.client.renderer.state.level.LevelRenderState',
            'net.minecraft.client.renderer.state.level.SkyRenderState',
            'net.minecraft.client.Options',
            'net.minecraft.client.Particles',
            'net.minecraft.client.renderer.LevelRenderer',
            'net.minecraft.client.gui.screens.inventory.InventoryScreen',
            'net.minecraft.core.registries.BuiltInRegistries',
            'net.minecraft.world.entity.EntityType',
            'net.minecraft.server.packs.resources.Resource',
            'net.minecraft.server.packs.metadata.MetadataSectionType',
            'net.minecraft.server.packs.metadata.pack.ImageMetadata',
            'net.minecraft.client.gui.GuiGraphicsExtractor'
        ]     ]
        def result = new StringBuilder()
        names.each { name ->
            def p = new ProcessBuilder('javap', '-classpath', configurations.compileClasspath.asPath, '-p', name).redirectErrorStream(true).start()
            result.append(p.inputStream.text).append('\n'); p.waitFor()
        }
        file('build').mkdirs()
        file('build/api-signatures.txt').text = result.toString()
    }
}
