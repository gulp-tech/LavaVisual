plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = project.mod_version
group = 'tech.gulp'
base { archivesName = 'lavavisual' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
jar { from('LICENSE') }

tasks.register('apiSignatures') {
    doLast {
        def names = [
            'com.mojang.blaze3d.platform.Window',
            'net.minecraft.client.multiplayer.PlayerInfo',
            'net.minecraft.client.multiplayer.ServerData',
            'net.minecraft.client.gui.screens.inventory.InventoryScreen',
            'net.minecraft.client.renderer.state.gui.pip.PictureInPictureRenderState',
            'net.minecraft.client.renderer.state.gui.pip.GuiEntityRenderState',
            'net.minecraft.client.gui.render.state.pip.PictureInPictureRenderState',
            'net.minecraft.client.MouseHandler',
            'net.minecraft.client.KeyMapping',
            'net.minecraft.client.renderer.RenderPipelines',
            'net.minecraft.client.Minecraft'
        ]
        def result = new StringBuilder()
        names.each { name ->
            def p = new ProcessBuilder('javap', '-classpath', configurations.compileClasspath.asPath, '-p', name).redirectErrorStream(true).start()
            result.append(p.inputStream.text).append('\n'); p.waitFor()
        }
        file('build').mkdirs()
        file('build/api-signatures.txt').text = result.toString()
    }
}
