plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}
version = project.mod_version
group = 'tech.gulp'
base { archivesName = 'lavavisual' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
test { useJUnitPlatform() }
loom {
    runs {
        // Larger dev window for the CI screenshots (the release JAR is unaffected).
        client { programArgs '--width', '1280', '--height', '960' }
    }
}
jar { from('LICENSE') }

tasks.register('apiSignatures') {
    doLast {
        def names = [
            'net.minecraft.client.renderer.texture.DynamicTexture',
            'com.mojang.blaze3d.platform.NativeImage',
            'net.minecraft.client.renderer.texture.TextureManager',
            'net.minecraft.world.level.material.MapColor',
            'net.minecraft.world.level.material.MapColor$Brightness',
            'net.minecraft.world.level.levelgen.Heightmap$Types',
            'net.minecraft.world.level.dimension.DimensionType',
            'net.minecraft.resources.ResourceKey',
            'net.minecraft.client.Camera',
            'com.mojang.blaze3d.platform.InputConstants',
            'com.mojang.blaze3d.platform.InputConstants$Type',
            'com.mojang.blaze3d.platform.InputConstants$Key',
            'net.minecraft.client.input.KeyEvent',
            'net.minecraft.client.input.CharacterEvent',
            'net.minecraft.client.gui.components.EditBox',
            'net.minecraft.client.gui.screens.Screen',
            'net.minecraft.client.renderer.state.level.CameraRenderState',
            'net.minecraft.client.renderer.state.level.LevelRenderState',
            'net.minecraft.world.level.storage.WorldData',
            'net.minecraft.client.CameraType',
            'net.minecraft.world.level.LevelReader',
            'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase',
            'com.mojang.blaze3d.pipeline.DepthStencilState',
            'com.mojang.blaze3d.platform.CompareOp',
            'net.minecraft.client.multiplayer.ClientLevel',
            'net.minecraft.client.renderer.GameRenderer',
            'net.minecraft.client.Options',
            'net.minecraft.server.MinecraftServer'
        ]
        def result = new StringBuilder()
        names.each { name ->
            def p = new ProcessBuilder('javap', '-classpath', configurations.compileClasspath.asPath, '-p', name).redirectErrorStream(true).start()
            result.append(p.inputStream.text).append('\n'); p.waitFor()
        }
        file('build').mkdirs()
        file('build/api-signatures.txt').text = result.toString()
    }
}
